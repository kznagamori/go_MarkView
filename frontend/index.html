    <!--
      IMP-202 が定める DOM の骨格。クラス名と ID は表示仕様書（21 章）が参照する。
      利用者に見える文言はここに書かず、js/strings.js から与える（IMP-290）。
    -->
    <div id="app" data-theme="light">
      <!--
        ボタンは群（移動・ファイル・表示・編集・修飾）の順に並べ、群の間に区切り（.tb-sep）を置く
        （UI-020, DSP-100, DSP-103）。**ボタンの id は変えない**——panes.js は btn-${name} で id を組み立て、
        overlay.js / theme.js も id を直接参照する。並びはこのファイルの順序だけで変わる（IMP-202）。
        role="toolbar" は付けない（矢印キーでボタン間を移る作法が求められ、Tab で移る操作と変わる）。
        **押せるかどうかが起動時に決まらないボタンは disabled で読み込む**（確定するまで押せない側に倒す。
        UI-021）。
      -->
      <header id="toolbar" class="toolbar">
        <!-- 移動（UI-020 の左 1・2, FR-051）。押せるかは history:changed の値で決める（IMP-323） -->
        <button id="btn-back" class="tb-btn" type="button" disabled>
          <svg class="icon" aria-hidden="true"><use href="#icon-back" /></svg>
        </button>
        <button id="btn-forward" class="tb-btn" type="button" disabled>
          <svg class="icon" aria-hidden="true"><use href="#icon-forward" /></svg>
        </button>
        <span class="tb-sep" aria-hidden="true"></span>
        <!-- ファイル（UI-020 の左 3・4）。再読み込みは文書未表示（welcome）では押せない（UI-021） -->
        <button id="btn-open" class="tb-btn" type="button">
          <svg class="icon" aria-hidden="true"><use href="#icon-open" /></svg>
        </button>
        <button id="btn-reload" class="tb-btn" type="button" disabled>
          <svg class="icon" aria-hidden="true"><use href="#icon-reload" /></svg>
        </button>
        <span class="tb-sep" aria-hidden="true"></span>
        <!-- 表示（UI-020 の左 5〜7）。ファイルツリーのボタンをアウトラインの左に置く（ペインの並びとそろえる） -->
        <button id="btn-filetree" class="tb-btn tb-toggle" type="button" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="#icon-filetree" /></svg>
        </button>
        <button id="btn-outline" class="tb-btn tb-toggle" type="button" aria-pressed="true">
          <svg class="icon" aria-hidden="true"><use href="#icon-outline" /></svg>
        </button>
        <button id="btn-theme" class="tb-btn" type="button">
          <svg class="icon" aria-hidden="true"><use href="#icon-moon" /></svg>
        </button>
        <span class="tb-sep" aria-hidden="true"></span>
        <!--
          エディタで開く（UI-020 の左 8, FR-090）。アイコンは外への矢印（icon-external。4.75.0）。
          初期値は disabled とする。文書を表示するか状態画面を出した時点で
          toolbar.js が活性を決める（UI-021）。**確定するまで押せない側に倒す。**
        -->
        <button id="btn-edit" class="tb-btn" type="button" disabled>
          <svg class="icon" aria-hidden="true"><use href="#icon-external" /></svg>
        </button>
        <!--
          編集モード（UI-020 の左 9, FR-140）。**disabled で読み込む**——起動時は unavailable であり
          （DSP-320）、押せるかどうかは届いた DocumentDTO.editable から決める（UI-021, IMP-260）。
          id の edit は「エディタで開く」を指すため、こちらは editmode とする（IMP-202）。
        -->
        <button id="btn-editmode" class="tb-btn tb-toggle" type="button" aria-pressed="false" disabled>
          <svg class="icon" aria-hidden="true"><use href="#icon-editmode" /></svg>
        </button>
        <!--
          修飾（UI-020 の左 10・11, FR-146, FR-147）。手前の区切りと一緒に、編集モードの間だけ出す
          （hidden。IMP-202, DSP-103）。押せるかは IMP-265 の canFormat() で決める
        -->
        <span id="tb-format" class="tb-group" hidden>
          <span class="tb-sep" aria-hidden="true"></span>
          <button id="btn-strike" class="tb-btn" type="button" disabled>
            <svg class="icon" aria-hidden="true"><use href="#icon-strike" /></svg>
          </button>
          <button id="btn-color" class="tb-btn" type="button" aria-haspopup="menu" aria-expanded="false" disabled>
            <svg class="icon" aria-hidden="true"><use href="#icon-color" /></svg>
          </button>
        </span>
        <span class="tb-spacer"></span>
        <button id="btn-about" class="tb-btn" type="button">
          <svg class="icon" aria-hidden="true"><use href="#icon-about" /></svg>
        </button>
      </header>

      <main id="content" class="content">
        <!--
          ファイルツリーのペインは、見出しの行（.pane-head）・ツリールートの名前の行・スクロールする器
          （.pane-body）の 3 つを縦に並べる（IMP-202, DSP-110, UI-030。4.75.0）。見出しの行と名前の行を
          器の外に置き、ツリーを横にスクロールしても右端のボタンが流れないようにする。ペインの機能の
          ボタンは .pane-actions の中に右から左へ並べる（v1.2.0 はフィルターボタンだけ。UI-033）。
        -->
        <nav id="pane-filetree" class="pane pane-filetree" hidden>
          <div class="pane-head">
            <div class="pane-title"></div>
            <div class="pane-actions">
              <button id="btn-treefilter" class="pane-btn" type="button" aria-haspopup="dialog" aria-expanded="false">
                <svg class="icon" aria-hidden="true"><use href="#icon-filter" /></svg>
              </button>
            </div>
          </div>
          <div class="pane-subtitle" id="tree-root-name"></div>
          <div class="pane-body">
            <ul id="tree" class="tree" role="tree"></ul>
          </div>
        </nav>
        <div id="resizer-filetree" class="resizer" hidden></div>

        <nav id="pane-outline" class="pane pane-outline">
          <div class="pane-title"></div>
          <ul id="outline" class="outline"></ul>
        </nav>
        <div id="resizer-outline" class="resizer"></div>

        <!--
          #viewer-frame はスクロールしない器（IMP-202, UI-055, DSP-126）。編集モードの枠と右下のラベルを、
          本文と一緒に流れない位置に置く。**スクロールする器は #viewer だけのまま**（UI-051）。
        -->
        <div id="viewer-frame" class="viewer-frame">
          <section id="viewer" class="viewer" tabindex="-1">
            <div class="searchbar-anchor">
              <div id="searchbar" class="searchbar" hidden></div>
            </div>
            <article id="markdown" class="markdown-body"></article>
            <div id="state-screen" class="state-screen" hidden></div>
          </section>
          <div id="editmode-badge" class="editmode-badge" hidden></div>
        </div>
      </main>

      <footer id="statusbar" class="status">
        <span id="status-path" class="status-path"></span>
        <span id="status-meta" class="status-meta"></span>
        <span id="status-message" class="status-message" hidden></span>
      </footer>

      <div id="overlay" class="overlay" hidden></div>
      <!--
        拡大画面（IMP-253）と右クリックメニュー（IMP-249）は #overlay の中に入れない（IMP-202）。
        #overlay はダイアログの暗幕であり全面を覆う。拡大画面はステータス領域を覆わず（UI-104）、
        右クリックメニューは情報ダイアログの上に出る（FR-063）。重なり順は DSP-015。
      -->
      <div id="expand-view" class="expand-view" role="dialog" aria-modal="true" hidden></div>
      <div id="contextmenu" class="contextmenu" role="menu" hidden></div>
      <!--
        右クリックメニューのサブメニュー（IMP-249, DSP-141）とファイルツリーのフィルターの枚（IMP-271,
        DSP-115）も、ペインと本文の外に置く（IMP-202。4.75.0）。枚はペインより広く、ペインの中に置くと
        端で切れ、ツリーと一緒にスクロールして流れる。位置はボタンや項目の位置から求める。
        ツールバーの文字色の一覧は #contextmenu を使い回す（IMP-202, UI-085）。
      -->
      <div id="contextsubmenu" class="contextmenu contextmenu-sub" role="menu" hidden></div>
      <div id="treefilter" class="treefilter" role="dialog" hidden></div>
      <div id="dropzone" class="dropzone" hidden></div>
      <div id="tooltip" class="tooltip" hidden></div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
