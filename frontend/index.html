    <!--
      IMP-202 が定める DOM の骨格。クラス名と ID は表示仕様書（21 章）が参照する。
      利用者に見える文言はここに書かず、js/strings.js から与える（IMP-290）。
    -->
    <div id="app" data-theme="light">
      <header id="toolbar" class="toolbar">
        <button id="btn-open" class="tb-btn" type="button">
          <svg class="icon" aria-hidden="true"><use href="#icon-open" /></svg>
        </button>
        <button id="btn-reload" class="tb-btn" type="button">
          <svg class="icon" aria-hidden="true"><use href="#icon-reload" /></svg>
        </button>
        <button id="btn-theme" class="tb-btn" type="button">
          <svg class="icon" aria-hidden="true"><use href="#icon-moon" /></svg>
        </button>
        <button id="btn-outline" class="tb-btn tb-toggle" type="button" aria-pressed="true">
          <svg class="icon" aria-hidden="true"><use href="#icon-outline" /></svg>
        </button>
        <button id="btn-filetree" class="tb-btn tb-toggle" type="button" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="#icon-filetree" /></svg>
        </button>
        <!--
          エディタで開く（UI-020 の左 6, FR-090）。
          初期値は disabled とする。文書を表示するか状態画面を出した時点で
          toolbar.js が活性を決める（UI-021）。**確定するまで押せない側に倒す。**
        -->
        <button id="btn-edit" class="tb-btn" type="button" disabled>
          <svg class="icon" aria-hidden="true"><use href="#icon-pencil" /></svg>
        </button>
        <span class="tb-spacer"></span>
        <button id="btn-about" class="tb-btn" type="button">
          <svg class="icon" aria-hidden="true"><use href="#icon-about" /></svg>
        </button>
      </header>

      <main id="content" class="content">
        <nav id="pane-filetree" class="pane pane-filetree" hidden>
          <div class="pane-title"></div>
          <div class="pane-subtitle" id="tree-root-name"></div>
          <ul id="tree" class="tree" role="tree"></ul>
        </nav>
        <div id="resizer-filetree" class="resizer" hidden></div>

        <nav id="pane-outline" class="pane pane-outline">
          <div class="pane-title"></div>
          <ul id="outline" class="outline"></ul>
        </nav>
        <div id="resizer-outline" class="resizer"></div>

        <section id="viewer" class="viewer" tabindex="-1">
          <article id="markdown" class="markdown-body"></article>
          <div id="state-screen" class="state-screen" hidden></div>
          <div id="searchbar" class="searchbar" hidden></div>
        </section>
      </main>

      <footer id="status" class="status">
        <span id="status-path" class="status-path"></span>
        <span id="status-meta" class="status-meta"></span>
        <span id="status-message" class="status-message" hidden></span>
      </footer>

      <div id="overlay" class="overlay" hidden></div>
      <div id="dropzone" class="dropzone" hidden></div>
      <div id="tooltip" class="tooltip" hidden></div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
